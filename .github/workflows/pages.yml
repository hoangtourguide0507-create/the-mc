name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run core logic tests
        run: python3 tests/test_core_logic.py

      - name: Run quest tests
        run: npm run test:quests

      - name: Run evaluator tests
        run: npm run test:evaluator

      - name: Run difficulty tests
        run: npm run test:difficulty

      - name: Run scene variant tests
        run: npm run test:variants

      - name: Run spaced repetition tests
        run: npm run test:srs

      - name: Run progress tests
        run: npm run test:progress

      - name: Run pronunciation ladder tests
        run: npm run test:pronladder

      - name: Run grammar tests
        run: npm run test:grammar

      - name: Run chunk data tests
        run: npm run test:chunks

      - name: Run lesson flow tests
        run: npm run test:lesson

      - name: Run live show tests
        run: npm run test:show

      - name: Run event pack tests
        run: npm run test:events

      - name: Run learning logic tests
        run: npm run test:learning

      - name: Run cumulative scoring tests
        run: npm run test:retry

      - name: Run scenario tests
        run: npm run test:scenarios

      - name: Run voice line tests
        run: npm run test:voicelines
      - name: Branching talk test
        run: npm run test:talk

      - name: Build (typecheck + Vite)
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
